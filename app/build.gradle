plugins {
    id "com.android.application"
}

android {
    namespace "de.wallpanel.cam"
    compileSdk 34

    defaultConfig {
        applicationId "de.wallpanel.cam"
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName "2.0"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5"
    testImplementation "junit:junit:4.13.2"
}
